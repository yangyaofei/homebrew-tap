name: Sync Casks

# 定时自动同步上游公开仓库（cdproxy / denpa-jack）的最新 GitHub Release 到本 Tap。
# 仅使用内置 GITHUB_TOKEN，无需跨仓库 PAT，永不过期；支持随时手动 workflow_dispatch 触发。
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-casks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest releases into Casks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          TARGETS = [
              {
                  "name": "cdproxy",
                  "repo": "yangyaofei/cdproxy",
                  "cask": Path("Casks/cdproxy.rb"),
                  "asset_pattern": "cdproxy_{ver}_darwin_arm64.zip",
                  "sums_asset": "SHA256SUMS_darwin.txt",
              },
              {
                  "name": "denpa-jack",
                  "repo": "yangyaofei/denpa-jack",
                  "cask": Path("Casks/denpa-jack.rb"),
                  "asset_pattern": "Denpa.Jack_{ver}_aarch64.dmg",
                  "sums_asset": "SHA256SUMS_darwin.txt",
              },
          ]

          token = os.environ.get("GH_TOKEN", "").strip()

          def gh_request(url: str, accept: str = "application/vnd.github+json") -> bytes:
              headers = {"User-Agent": "yangyaofei-homebrew-tap-sync", "Accept": accept}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return resp.read()

          def sha256_of_asset(release: dict, asset: dict, sums_asset_name: str) -> str:
              digest = str(asset.get("digest") or "").strip().lower()
              if digest.startswith("sha256:") and re.fullmatch(r"[0-9a-f]{64}", digest[7:]):
                  return digest[7:]
              for item in release.get("assets", []):
                  if item.get("name") == sums_asset_name:
                      text = gh_request(item["browser_download_url"], accept="application/octet-stream").decode("utf-8", "replace")
                      for line in text.splitlines():
                          parts = line.strip().split()
                          if len(parts) >= 2 and Path(parts[1]).name == asset["name"] and re.fullmatch(r"[0-9a-f]{64}", parts[0].lower()):
                              return parts[0].lower()
              h = hashlib.sha256()
              req = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "yangyaofei-homebrew-tap-sync"})
              with urllib.request.urlopen(req, timeout=180) as resp:
                  while True:
                      chunk = resp.read(1 << 20)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest()

          updated = []
          for t in TARGETS:
              try:
                  rel = json.loads(gh_request(f"https://api.github.com/repos/{t['repo']}/releases/latest"))
              except urllib.error.HTTPError as e:
                  print(f"[skip] {t['name']}: failed to query latest release (HTTP {e.code})")
                  continue
              if rel.get("draft") or rel.get("prerelease"):
                  print(f"[skip] {t['name']}: latest release is draft/prerelease")
                  continue
              tag = str(rel.get("tag_name") or "").strip()
              ver = tag.lstrip("v")
              if not ver:
                  continue
              want_asset = t["asset_pattern"].format(ver=ver)
              asset = next((a for a in rel.get("assets", []) if a.get("name") == want_asset), None)
              if asset is None:
                  print(f"[skip] {t['name']} {tag}: asset {want_asset} not uploaded yet")
                  continue

              sha = sha256_of_asset(rel, asset, t["sums_asset"])
              cask_path: Path = t["cask"]
              orig = cask_path.read_text(encoding="utf-8")
              cur_ver = re.search(r'version "([^"]+)"', orig)
              cur_sha = re.search(r'sha256 "([0-9a-f]{64})"', orig)
              if cur_ver and cur_sha and cur_ver.group(1) == ver and cur_sha.group(1) == sha:
                  print(f"[ok] {t['name']} already at {ver} ({sha[:12]}...)")
                  continue

              next_txt, n1 = re.subn(r'version "[^"]+"', f'version "{ver}"', orig, count=1)
              next_txt, n2 = re.subn(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha}"', next_txt, count=1)
              if n1 != 1 or n2 != 1:
                  raise SystemExit(f"failed to update {cask_path}: n1={n1} n2={n2}")
              cask_path.write_text(next_txt, encoding="utf-8")
              print(f"[updated] {t['name']} -> {ver} ({sha[:12]}...)")
              updated.append(f"{t['name']} {ver}")

          out_file = os.environ.get("GITHUB_OUTPUT")
          if out_file:
              with open(out_file, "a", encoding="utf-8") as f:
                  f.write(f"summary={', '.join(updated)}\n")
          PY

      - name: Commit & push if changed
        run: |
          if git diff --quiet Casks/; then
            echo "All casks are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/
          git commit -m "chore(casks): sync latest releases"
          git push origin HEAD:main
